add_meal:
  description: Speichert Rezept mit Gesamtzutatenmengen und USDA-Nährwerten pro 100 g.
  fields:
    name:
      description: Name des Gerichts
      example: "Hähnchen mit Reis"
    meal_type:
      description: Art der Mahlzeit
      example: "lunch"
    servings:
      description: Anzahl der Portionen in den angegebenen Gesamtmengen
      example: 2
    ingredients:
      description: Zutaten mit positiver Menge und Einheit
      example:
        Hähnchen:
          amount: 200
          unit: g
        Reis:
          amount: 150
          unit: g
        Ei:
          amount: 2
          unit: Stück
          weight_per_unit_g: 60

delete_meal:
  description: Löscht ein gespeichertes Gericht und entfernt es aus allen Wochenplänen.
  fields:
    name:
      description: Name des zu löschenden Gerichts
      example: "Hähnchen mit Reis"

generate_shopping_list:
  description: Aktualisiert Einkaufsliste und Sensoren für den aktuellen Wochenplan.

get_week_data:
  description: Gibt Plan, Nährwerte und Einkaufsliste für aktuelle oder nächste Woche zurück.
  fields:
    week_start:
      description: Optional; Montag der gewünschten Woche. Standard ist aktuelle Woche.
      example: "2026-10-12"

search_ingredient:
  description: Sucht USDA-Nährwerttreffer für eine Zutat zur Auswahl im Rezeptformular.
  fields:
    query:
      description: Zutatenname für die USDA-Suche
      example: "brown rice"
    force_refresh:
      description: USDA-Suche trotz gültigem Zwischenspeicher erneut ausführen
      example: true

generate_week_plan:
  description: Plant verfügbare Lunch- und Dinner-Rezepte für aktuelle oder nächste Woche.
  fields:
    week_start:
      description: Optional; Montag der gewünschten Woche. Standard ist aktuelle Woche.
      example: "2026-10-12"

set_planned_meal:
  description: Plant oder tauscht ein Gericht in der aktuellen oder nächsten Woche.
  fields:
    day:
      description: Datum des geplanten Tages im Format YYYY-MM-DD
      example: "2026-10-12"
    meal_type:
      description: Mahlzeitentyp breakfast, lunch oder dinner
      example: "breakfast"
    meal_name:
      description: Name eines gespeicherten Gerichts desselben Mahlzeitentyps
      example: "Gemüsesuppe"
