add_meal:
  description: Speichert Rezept mit Gesamtzutatenmengen und BLS- oder USDA-Nährwerten pro 100 g.
  fields:
    name:
      description: Name des Gerichts
      example: "Hähnchen mit Reis"
    meal_type:
      description: Art der Mahlzeit
      example: "lunch"
    servings:
      description: Anzahl der Portionen in den angegebenen Gesamtmengen
      example: 2
    ingredients:
      description: Zutaten mit positiver Menge, Einheit und BLS-Code oder USDA-Food-ID
      example:
        Haferflocken:
          amount: 100
          unit: g
          bls_code: "C131000"
    instructions:
      description: Optionale Zubereitung des Rezepts
      example: "Haferflocken mit Milch aufkochen."
    source_url:
      description: Optionale HTTPS-URL zur Rezeptquelle
      example: "https://example.org/recipe"
    source_name:
      description: Name der Rezeptquelle
      example: "TheMealDB"

delete_meal:
  description: Löscht ein gespeichertes Gericht und entfernt es aus allen Wochenplänen.
  fields:
    name:
      description: Name des zu löschenden Gerichts
      example: "Hähnchen mit Reis"

generate_shopping_list:
  description: Aktualisiert Einkaufsliste und Sensoren für den aktuellen Wochenplan.

get_week_data:
  description: Gibt Plan, Nährwerte und Einkaufsliste für aktuelle oder nächste Woche zurück.
  fields:
    week_start:
      description: Optional; Montag der gewünschten Woche. Standard ist aktuelle Woche.
      example: "2026-10-12"

search_ingredient:
  description: Sucht BLS- oder USDA-Nährwerttreffer für eine Zutat.
  fields:
    query:
      description: Zutatenname; BLS sucht standardmäßig deutsch und englisch
      example: "Haferflocken"
    source:
      description: BLS (Standard) oder usda
      example: "bls"
    force_refresh:
      description: USDA-Suche trotz gültigem Zwischenspeicher erneut ausführen
      example: true

search_recipe:
  description: Sucht Gerichte nach Name in TheMealDB; Ergebnisse können importiert werden.
  fields:
    query:
      description: Gerichtname für die TheMealDB-Suche
      example: "chicken"

get_meal_details:
  description: Gibt Zubereitung und Herkunft eines gespeicherten Gerichts zurück.
  fields:
    name:
      description: Name des gespeicherten Gerichts
      example: "Linsencurry"

generate_week_plan:
  description: Plant verfügbare Lunch- und Dinner-Rezepte für aktuelle oder nächste Woche.
  fields:
    week_start:
      description: Optional; Montag der gewünschten Woche. Standard ist aktuelle Woche.
      example: "2026-10-12"

set_planned_meal:
  description: Plant oder tauscht ein Gericht in der aktuellen oder nächsten Woche.
  fields:
    day:
      description: Datum des geplanten Tages im Format YYYY-MM-DD
      example: "2026-10-12"
    meal_type:
      description: Mahlzeitentyp breakfast, lunch oder dinner
      example: "breakfast"
    meal_name:
      description: Name eines gespeicherten Gerichts desselben Mahlzeitentyps
      example: "Gemüsesuppe"
